# Docker profile - these will be overridden by environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Trust reverse-proxy forwarded headers (X-Forwarded-For, X-Forwarded-Proto, etc.).
server.forward-headers-strategy=framework

#JWT config
application.security.jwt.secret-key=${APPLICATION_SECURITY_JWT_SECRETKEY}
application.security.jwt.expiration=${APPLICATION_SECURITY_JWT_EXPIRATION}
application.security.jwt.refresh-token.expiration=${APPLICATION_SECURITY_JWT_REFRESHTOKEN_EXPIRATION}
application.cors.allowed-origins=${APPLICATION_CORS_ALLOWED_ORIGINS:http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173,https://localhost,https://127.0.0.1,http://revizer.site,https://revizer.site}

app.docker-profile=${DOCKER_PROFILE}